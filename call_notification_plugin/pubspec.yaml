name: call_notification_plugin
description: A Flutter plugin for VoIP call-style notifications inspired by Signal Android
version: 0.0.1
homepage: https://github.com/yourorg/call_notification_plugin

environment:
  sdk: '>=2.17.0 <4.0.0'
  flutter: ">=2.5.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.call_notification_plugin
        pluginClass: CallNotificationPlugin
      ios:
        pluginClass: CallNotificationPlugin